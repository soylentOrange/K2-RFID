# Build the web app and publish it on GitHub Pages
# (Settings > Pages > Source: "GitHub Actions")
# The site also hosts the firmware installer (install.html, ESP Web Tools) with the
# factory images of the newest release and pre-release (web/tools/fetch-firmware.mjs).
# The release workflow starts this workflow after publishing a release.
name: Web App (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "assets/data/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "assets/data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Add firmware for the installer
        run: node tools/fetch-firmware.mjs dist/firmware
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    # the github-pages environment only accepts deployments from main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
